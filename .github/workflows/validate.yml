name: Replay incident evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_case.py --replay
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_case.py --output-dir build/reproduced
      - run: diff -r data/raw build/reproduced/data/raw
      - run: diff results/alerts.json build/reproduced/results/alerts.json
